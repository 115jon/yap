# yap-admin: the site-admin console, its own Worker (README.md).
#
# Served only at yap-admin.115jon.com, a Custom Domain attached in the
# Cloudflare dashboard (not declared here: a `routes` entry would make every
# deploy re-sync it). workers.dev and Preview URLs are off, so the custom
# domain is the only way in.
name = "yap-admin"
main = "src/server/worker.ts"
compatibility_date = "2026-02-28"
compatibility_flags = ["nodejs_compat"]
# `@/` resolves to Yap's src/ through this tsconfig's paths.
tsconfig = "./tsconfig.json"
workers_dev = false
preview_urls = false
upload_source_maps = false

# The client build (vite build --config apps/admin/vite.config.ts). Every
# request, assets included, runs the Worker first: its gate decides.
[assets]
directory = "./dist/public"
binding = "ASSETS"
run_worker_first = true

# ── Secrets ───────────────────────────────────────────────────────────────
#   wrangler secret put SITE_ADMIN_USER_IDS --config apps/admin/wrangler.toml
#     comma-separated Yap user ids allowed in; unset = nobody

[vars]
# The "Yap Admin" Kova application's publishable key (origin and redirect
# URI https://yap-admin.115jon.com only). Empty = nobody can sign in.
KOVA_ADMIN_PUBLISHABLE_KEY = ""
# KOVA_AUTH_URL is left unset: DEFAULT_KOVA_AUTH_URL (src/lib/site-defaults.ts).

# ── Yap's data (the same resources as the main Worker, wrangler.toml) ────────

[[d1_databases]]
binding = "DB"
database_name = "ralph-chat-db"
database_id = "0b10b6c3-b5c5-488d-a95d-f9a8e7433813"

[[kv_namespaces]]
binding = "CACHE"
id = "0ee41653bb684978af83430e53623019"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "ralph-chat-attachments"

# ── The main Worker's Durable Objects, by cross-script binding ───────────────
# Live ops reads /admin/introspect and suspension uses /admin/disconnect-user
# (realtime/meeting-room.ts) and /disconnect-participant (realtime/voice-room.ts)
# through these stubs; none of those paths has a public URL.

[[durable_objects.bindings]]
name = "MEETING_ROOM"
class_name = "RootMeetingRoom"
script_name = "ralph-meet"

[[durable_objects.bindings]]
name = "VOICE_ROOM"
class_name = "RootVoiceRoom"
script_name = "ralph-meet"

# The main Worker itself, for its build stamp (GET /api/healthz).
[[services]]
binding = "YAP"
service = "ralph-meet"

[observability.logs]
enabled = true
