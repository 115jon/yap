name: "Qt Android Release"

# Builds of the Qt Quick app (native/mobile, application id
# dev.yap.app), signed with its release key (native/mobile/README.md,
# "Releases").
#
# Two modes:
#
# - Release (release_tag set): release-please's qt-android-v<x.y.z>.
#   release-please.yml creates that release when its Qt release PR is
#   merged, marks it a draft pre-release and calls this workflow with
#   release_tag. The run builds the tagged commit (its VERSION must be
#   x.y.z), attaches the APKs and the App Bundle to that draft
#   (release-please's changelog is the notes) and publishes it as a
#   pre-release, never GitHub's latest. A
#   manual dispatch from main with release_tag rebuilds a release whose
#   call failed (it must still be a draft).
# - Manual (no release_tag, dispatch only): a test build of the commit the
#   run starts on, version <VERSION>-build.<run>, uploaded to a draft
#   pre-release qt-android-v<that version>. Drafts create no tag; delete
#   the draft when done with it.
#
# Jobs and what each can reach:
# - plan: the mode, the commit, the version and the version code. Write
#   only so the release list includes drafts; it runs no repository code.
# - build: compiles the core and the APKs (third-party crates' build
#   scripts run here), unsigned, per ABI, and stages each ABI's Gradle
#   project for the bundle. Only the Firebase client configuration, which
#   ends up inside the APK anyway. No caches: a release builds from clean
#   sources, and fetch-qt.ps1 checks each Qt archive it downloads against
#   qt-sdk.lock.json's SHA-256.
# - bundle: the App Bundle (AAB) for Google Play, both ABIs under one
#   version code (bundle.sh merges the build job's stages), unsigned,
#   checked with bundletool (pinned by SHA-256) and for 16 KB pages. Only
#   the Firebase client configuration, as in build.
# - sign: the release key, from the android-release environment, whose
#   deployment policy admits refs/heads/main only (release-please.yml's
#   call and dispatches from main both run there). It runs only the
#   repository's sign.sh, the SDK's zipalign, apksigner and aapt2 and the
#   JDK's jarsigner and keytool on the unsigned APKs and AAB, checks the
#   certificate, the application id and the version, and deletes the key.
#   No write token. The signed files' SHA-256s are its outputs.
# - smoke: the signed x86_64 APK cold-started on an emulator.
# - publish: the release (contents: write), after checking the APKs and the
#   AAB against the sign job's SHA-256s. No key.
#
# Who can have a commit signed: whoever can merge to main (the release PR,
# or any commit a dispatch from main builds) or start this workflow on
# main. qt-android-v* tags are release-please's (a repository ruleset lets
# only admins create, move or delete them). This workflow has no tag
# trigger, and the plan job refuses any ref but refs/heads/main.
#
# Version code: 30000000 + minutes since 2026-01-01 UTC, from the plan
# job's clock, one code for both APKs and the AAB (an AAB holds every ABI
# under one code; Google Play takes one code per upload). Every build is
# above the one before, whichever workflow run started it, and above every
# code shipped before: the per-ABI (2000000 + minutes) * 10 + digit codes
# (0.3.1 to 0.11.1, at most 24573684) and the (1000000 + run) * 10 + digit
# ones (0.2.0, 0.3.0) stay below 30000000. The run number cannot be used: a
# called workflow sees the caller's.
on:
  workflow_call:
    inputs:
      release_tag:
        description: "The release-please tag to build and publish (qt-android-v<x.y.z>); its release must be a draft"
        required: true
        type: string
    secrets:
      QT_GOOGLE_SERVICES_JSON_BASE64:
        required: true
      # The release key, read only by the sign job. They are android-release
      # environment secrets: the caller (a job without an environment)
      # passes them by name, never `inherit`, but its values are empty, and
      # in the sign job, which has `environment: android-release`, GitHub
      # uses the environment's secrets instead of the caller's. Not
      # required, so empty caller values cannot fail the call; the sign job
      # fails on an empty key.
      QT_ANDROID_KEYSTORE_BASE64:
        required: false
      QT_ANDROID_KEYSTORE_PASSWORD:
        required: false
      QT_ANDROID_KEY_ALIAS:
        required: false
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Rebuild a release-please release whose run failed: its tag (qt-android-v<x.y.z>; the release must still be a draft). Empty: a test build of this commit, uploaded to a draft."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  # One run per release tag; manual test builds queue per ref.
  group: qt-android-release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    # bash -eo pipefail
    shell: bash

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # SHA-256 of the release certificate (alias yapapp). The sign job fails
  # if an APK carries any other.
  EXPECTED_CERT_SHA256: "75:E0:D8:E0:22:4A:9F:32:D8:CC:40:C7:B9:5A:E7:82:43:B3:97:21:5A:99:C1:FE:D6:01:50:FC:6E:FF:B8:9C"
  APP_ID: dev.yap.app
  BUILD_TOOLS: 36.0.0
  # bundletool (github.com/google/bundletool), pinned by SHA-256: checks
  # the AAB and makes APKs from it as Google Play would.
  BUNDLETOOL_VERSION: 1.18.3
  BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29

jobs:
  plan:
    if: ${{ github.repository == '115jon/yap' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Write only so the release list includes drafts (release-please's
      # draft in release mode, an earlier test build's in manual mode).
      contents: write
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      code: ${{ steps.plan.outputs.code }}
    steps:
      # Release mode builds the tag release-please made; manual runs the
      # commit they were started on.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Mode, commit, version and version code
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
        run: |
          base="$(head -n 1 native/mobile/VERSION)"
          if ! [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::native/mobile/VERSION must be x.y.z, got '$base'"
            exit 1
          fi
          # The signing environment admits main only; fail here, before the
          # build, rather than at the sign job.
          if [ "$GIT_REF" != refs/heads/main ]; then
            echo "::error::A signed build runs from main (the android-release environment admits refs/heads/main only); this run is on $GIT_REF."
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          releases="$(gh api "repos/$REPO/releases?per_page=100" --paginate \
            --jq '.[] | [.tag_name, (if .draft then "draft" else "published" end)] | @tsv')"
          if [ -n "$RELEASE_TAG" ]; then
            mode=release
            tag="$RELEASE_TAG"
            if ! [[ "$tag" =~ ^qt-android-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "::error::release_tag '$tag' is not qt-android-v<x.y.z>"
              exit 1
            fi
            version="${BASH_REMATCH[1]}"
            if [ "$version" != "$base" ]; then
              echo "::error::release_tag $tag does not match native/mobile/VERSION ($base) at that tag"
              exit 1
            fi
            git fetch -q --no-tags origin main
            if ! git merge-base --is-ancestor "$sha" FETCH_HEAD; then
              echo "::error::tag $tag is not on main"
              exit 1
            fi
            states="$(awk -F '\t' -v t="$tag" '$1 == t { print $2 }' <<<"$releases")"
            if [ "$states" != draft ]; then
              echo "::error::Expected one draft release for $tag, found: ${states:-none}. To rebuild a published one, make it a draft first (gh release edit $tag --draft=true)."
              exit 1
            fi
            # The build's version code would be above a newer published
            # release's, so testers on that one would "update" to an older
            # version.
            newest="$(awk -F '\t' '$2 == "published" && $1 ~ /^qt-android-v[0-9]+\.[0-9]+\.[0-9]+$/ { sub(/^qt-android-v/, "", $1); print $1 }' <<<"$releases" | sort -V | tail -n 1)"
            if [ -n "$newest" ] && [ "$newest" != "$version" ] &&
              [ "$(printf '%s\n%s\n' "$newest" "$version" | sort -V | tail -n 1)" = "$newest" ]; then
              echo "::error::qt-android-v$newest is already published, newer than $tag; release a newer version instead."
              exit 1
            fi
          else
            mode=manual
            if [ "$EVENT_NAME" != workflow_dispatch ]; then
              echo "::error::Without release_tag this workflow runs only by hand."
              exit 1
            fi
            version="$base-build.$GITHUB_RUN_NUMBER"
            tag="qt-android-v$version"
            if awk -F '\t' -v t="$tag" '$1 == t && $2 == "published" { found = 1 } END { exit !found }' <<<"$releases"; then
              echo "::error::$tag is already published"
              exit 1
            fi
          fi
          minutes=$(( ($(date -u +%s) - 1767225600) / 60 ))
          {
            echo "mode=$mode"
            echo "sha=$sha"
            echo "version=$version"
            echo "tag=$tag"
            echo "code=$(( 30000000 + minutes ))"
          } >>"$GITHUB_OUTPUT"
          echo "$mode: version $version (code $(( 30000000 + minutes ))), tag $tag, commit $sha"

  build:
    name: build (${{ matrix.abi }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: true
      matrix:
        include:
          - abi: arm64-v8a
            rust: aarch64-linux-android
            qt: android-arm64_v8a
            qt_dir: android_arm64_v8a
          - abi: x86_64
            rust: x86_64-linux-android
            qt: android-x86_64
            qt_dir: android_x86_64
    env:
      YAPM: ${{ github.workspace }}/.yapm
      QT_HOST_PATH: ${{ github.workspace }}/.yapm/qt/gcc_64
      QT_TARGET_ROOT: ${{ github.workspace }}/.yapm/qt/${{ matrix.qt_dir }}
      # The NDK Qt 6.11.3 for Android was built with (r27c).
      NDK_VERSION: 27.2.12479018
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-10-16)
        with:
          targets: ${{ matrix.rust }}

      - name: JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - name: Ninja and 7-Zip
        # Skipped when the image has both. Otherwise retried: an unreachable
        # mirror (security.ubuntu.com has failed to resolve on the runners)
        # must not fail the build when the main archive answers.
        run: |
          if command -v ninja >/dev/null && command -v 7z >/dev/null; then
            ninja --version; exit 0
          fi
          for attempt in 1 2 3 4; do
            sudo apt-get update -qq -o Acquire::Retries=3 || true
            if sudo apt-get install -y -qq -o Acquire::Retries=3 ninja-build p7zip-full; then
              exit 0
            fi
            sleep $((attempt * 15))
          done
          exit 1

      - name: Android NDK, platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$NDK_VERSION" "platforms;android-36" "build-tools;$BUILD_TOOLS" >/dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >>"$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >>"$GITHUB_ENV"

      - name: Qt 6.11.3 (host and target)
        shell: pwsh
        run: |
          ./native/mobile/fetch-qt.ps1 -Dest .yapm/qt -DownloadDir .yapm/qt-download `
            -Set host-linux,${{ matrix.qt }}

      # Push notifications need the dev.yap.app Firebase client
      # (android/build.gradle). A release without it would ship without
      # pushes, so it fails instead.
      - name: Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.QT_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::QT_GOOGLE_SERVICES_JSON_BASE64 is not set"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/firebase"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d >"$RUNNER_TEMP/firebase/google-services.json"
          echo "YAP_GOOGLE_SERVICES_JSON=$RUNNER_TEMP/firebase/google-services.json" >>"$GITHUB_ENV"

      - name: Build the APK (${{ matrix.abi }}, release)
        env:
          CODE: ${{ needs.plan.outputs.code }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          bash native/mobile/build.sh ${{ matrix.abi }} Release \
            -DYAP_ANDROID_APP_ID="$APP_ID" \
            -DYAP_ANDROID_VERSION_CODE="$CODE" \
            -DYAP_ANDROID_VERSION_NAME="$VERSION" \
            -DYAP_ANDROID_COMPILE_SDK=android-36 \
            -DYAP_ANDROID_BUILD_TOOLS="$BUILD_TOOLS"
          mkdir -p unsigned
          cp "$YAPM/build/qt-${{ matrix.abi }}-Release/android-build/build/outputs/apk/release/android-build-release-unsigned.apk" \
            "unsigned/yap-qt-${{ matrix.abi }}-unsigned.apk"

      # Every library's ELF LOAD segments (the sign job aligns the APK's
      # entries).
      - name: Check 16 KB pages
        run: bash native/mobile/check-16k.sh --elf "unsigned/yap-qt-${{ matrix.abi }}-unsigned.apk"

      # This ABI's Gradle project, for the bundle job.
      - name: Stage the Gradle project
        run: bash native/mobile/bundle.sh stage "$YAPM/build/qt-${{ matrix.abi }}-Release" "stage/${{ matrix.abi }}"

      - name: Remove the Firebase configuration
        if: always()
        run: rm -rf "$RUNNER_TEMP/firebase"

      - name: Upload the unsigned APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-${{ matrix.abi }}
          path: unsigned/yap-qt-${{ matrix.abi }}-unsigned.apk
          if-no-files-found: error
          retention-days: 1

      - name: Upload the Gradle project
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage-${{ matrix.abi }}
          path: stage/${{ matrix.abi }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  # The App Bundle from both ABIs' Gradle projects: one version code, both
  # ABIs' libraries, the same Java and assets. Unsigned.
  bundle:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YAPM: ${{ github.workspace }}/.yapm
      NDK_VERSION: 27.2.12479018
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      # Gradle strips the libraries with the stages' NDK.
      - name: Android NDK, platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$NDK_VERSION" "platforms;android-36" "build-tools;$BUILD_TOOLS" >/dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >>"$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >>"$GITHUB_ENV"

      - name: bundletool
        run: |
          mkdir -p "$RUNNER_TEMP/bundletool"
          jar="$RUNNER_TEMP/bundletool/bundletool.jar"
          curl -fsSL --retry 4 -o "$jar" \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
          echo "$BUNDLETOOL_SHA256  $jar" | sha256sum -c -
          echo "BUNDLETOOL=$jar" >>"$GITHUB_ENV"

      - name: Download the Gradle projects
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: stage-*
          path: stage

      # The AAB's resources include the Firebase client, as each APK's do.
      - name: Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.QT_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::QT_GOOGLE_SERVICES_JSON_BASE64 is not set"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/firebase"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d >"$RUNNER_TEMP/firebase/google-services.json"
          echo "YAP_GOOGLE_SERVICES_JSON=$RUNNER_TEMP/firebase/google-services.json" >>"$GITHUB_ENV"

      - name: Build the AAB
        run: |
          bash native/mobile/bundle.sh merge unsigned/yap-qt-unsigned.aab \
            stage/stage-arm64-v8a stage/stage-x86_64

      - name: Remove the Firebase configuration
        if: always()
        run: rm -rf "$RUNNER_TEMP/firebase"

      - name: Check the AAB
        env:
          CODE: ${{ needs.plan.outputs.code }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          aab=unsigned/yap-qt-unsigned.aab
          java -jar "$BUNDLETOOL" validate --bundle "$aab" >/dev/null
          manifest() { java -jar "$BUNDLETOOL" dump manifest --bundle "$aab" --xpath "$1"; }
          got="$(manifest /manifest/@package) $(manifest /manifest/@android:versionCode) $(manifest /manifest/@android:versionName)"
          echo "$got"
          if [ "$got" != "$APP_ID $CODE $VERSION" ]; then
            echo "::error::$aab: expected \"$APP_ID $CODE $VERSION\""
            exit 1
          fi
          abis="$(unzip -Z1 "$aab" | sed -n 's#^base/lib/\([^/]*\)/.*#\1#p' | sort -u | tr '\n' ' ')"
          echo "ABIs: $abis"
          if [ "$abis" != "arm64-v8a x86_64 " ]; then
            echo "::error::$aab: expected arm64-v8a and x86_64, found: $abis"
            exit 1
          fi
          # The split APKs Google Play would make, aligned as it would.
          java -jar "$BUNDLETOOL" build-apks --bundle "$aab" --output "$RUNNER_TEMP/yap.apks"
          bash native/mobile/check-16k.sh --elf "$aab"
          YAP_BUILD_TOOLS="$BUILD_TOOLS" bash native/mobile/check-16k.sh --zip "$RUNNER_TEMP/yap.apks"
          ls -l "$aab"

      - name: Upload the unsigned AAB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-aab
          path: unsigned/yap-qt-unsigned.aab
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: [plan, build, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds the release key's secrets; its deployment policy admits
    # refs/heads/main only.
    environment: android-release
    outputs:
      sha256_arm64: ${{ steps.sign.outputs.sha256_arm64 }}
      sha256_x86_64: ${{ steps.sign.outputs.sha256_x86_64 }}
      sha256_aab: ${{ steps.sign.outputs.sha256_aab }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
          sparse-checkout: native/mobile/sign.sh
          sparse-checkout-cone-mode: false

      - name: Build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;$BUILD_TOOLS" >/dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >>"$GITHUB_ENV"

      - name: Download the unsigned APKs and AAB
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: unsigned-*
          merge-multiple: true
          path: unsigned

      - name: Decode the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.QT_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::QT_ANDROID_KEYSTORE_BASE64 is not available to this run"
            exit 1
          fi
          mkdir -m 700 "$RUNNER_TEMP/key"
          (umask 077 && printf '%s' "$KEYSTORE_BASE64" | base64 -d >"$RUNNER_TEMP/key/release.p12")

      - name: Sign and check
        id: sign
        env:
          YAP_KEYSTORE_PASS: ${{ secrets.QT_ANDROID_KEYSTORE_PASSWORD }}
          YAP_KEY_ALIAS: ${{ secrets.QT_ANDROID_KEY_ALIAS }}
          VERSION: ${{ needs.plan.outputs.version }}
          CODE: ${{ needs.plan.outputs.code }}
        run: |
          export YAP_KEYSTORE="$RUNNER_TEMP/key/release.p12" YAP_BUILD_TOOLS="$BUILD_TOOLS"
          bt="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          expected="$(echo "$EXPECTED_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')"
          mkdir -p out
          for abi in arm64-v8a x86_64; do
            apk="out/yap-qt-$VERSION-$abi.apk"
            bash native/mobile/sign.sh "unsigned/yap-qt-$abi-unsigned.apk" "$apk"
            certs="$("$bt/apksigner" verify --min-sdk-version 28 --print-certs "$apk")"
            echo "$certs"
            actual="$(echo "$certs" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
            if [ "$actual" != "$expected" ] || [ "$(echo "$certs" | grep -c '^Signer #[0-9]* certificate DN:')" -ne 1 ]; then
              echo "::error::$apk is not signed with the release certificate alone (got ${actual:-none})"
              exit 1
            fi
            badging="$("$bt/aapt2" dump badging "$apk" | head -n 1)"
            echo "$badging"
            want="package: name='$APP_ID' versionCode='$CODE' versionName='$VERSION'"
            if [[ "$badging" != "$want"* ]]; then
              echo "::error::$apk: expected \"$want\""
              exit 1
            fi
            echo "sha256_${abi%-v8a}=$(sha256sum "$apk" | cut -d ' ' -f 1)" >>"$GITHUB_OUTPUT"
          done
          # The AAB: a JAR signature (the bundle job checked its manifest).
          aab="out/yap-qt-$VERSION.aab"
          bash native/mobile/sign.sh unsigned/yap-qt-unsigned.aab "$aab"
          certs="$("${JAVA_HOME:+$JAVA_HOME/bin/}keytool" -printcert -jarfile "$aab")"
          actual="$(echo "$certs" | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')"
          if [ "$actual" != "$expected" ] || [ "$(echo "$certs" | grep -c '^Signer #[0-9]*:')" -ne 1 ]; then
            echo "$certs"
            echo "::error::$aab is not signed with the release certificate alone (got ${actual:-none})"
            exit 1
          fi
          echo "$aab: release certificate"
          echo "sha256_aab=$(sha256sum "$aab" | cut -d ' ' -f 1)" >>"$GITHUB_OUTPUT"
          ls -l out

      - name: Remove the release key
        if: always()
        run: rm -rf "$RUNNER_TEMP/key"

      - name: Upload the signed APKs and AAB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yap-qt-${{ needs.plan.outputs.version }}
          path: |
            out/*.apk
            out/*.apk.sha256
            out/*.aab
            out/*.aab.sha256
          if-no-files-found: error
          # Public (the repository is): keep it no longer than the run needs.
          retention-days: 1

  # The signed x86_64 APK cold-started on an emulator (API 35), as CI's
  # qt-android-smoke does with the debug-signed one.
  smoke:
    needs: [plan, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EMULATOR_API: 35
      EMULATOR_TARGET: google_apis
      EMULATOR_ARCH: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Download the signed APKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: yap-qt-${{ needs.plan.outputs.version }}
          path: out

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator's system image (about 1 GB) comes from dl.google.com,
      # which sometimes drops the download ("Premature EOF"), and
      # android-emulator-runner does not retry it. So the image is cached
      # (keyed on the API level, target and architecture the action is asked
      # for), and a miss downloads it here with retries; the action then
      # finds it installed. The AVD is not cached: the smoke is a cold boot
      # (-no-snapshot), which a cached AVD would not speed up. The same two
      # steps are in native-mobile.yml and qt-android-release.yml.
      - name: Cache the emulator system image
        id: system-image
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /usr/local/lib/android/sdk/system-images/android-${{ env.EMULATOR_API }}/${{ env.EMULATOR_TARGET }}/${{ env.EMULATOR_ARCH }}
          key: android-system-image-v1-${{ env.EMULATOR_API }}-${{ env.EMULATOR_TARGET }}-${{ env.EMULATOR_ARCH }}

      - name: Download the emulator system image
        if: steps.system-image.outputs.cache-hit != 'true'
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          image="system-images;android-$EMULATOR_API;$EMULATOR_TARGET;$EMULATOR_ARCH"
          for attempt in 1 2 3 4; do
            # `yes` accepts the licence prompt (as the action does).
            if "$sdkmanager" --install "$image" < <(yes); then
              exit 0
            fi
            echo "::warning::sdkmanager could not install $image (attempt $attempt of 4)"
            sleep $((attempt * 15))
          done
          echo "::error::the emulator system image could not be downloaded"
          exit 1

      - name: Cold start on an emulator
        # ReactiveCircus/android-emulator-runner v2.38.0
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ env.EMULATOR_API }}
          arch: ${{ env.EMULATOR_ARCH }}
          target: ${{ env.EMULATOR_TARGET }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: YAP_ANDROID_APP_ID=${{ env.APP_ID }} bash native/mobile/smoke.sh out/yap-qt-${{ needs.plan.outputs.version }}-x86_64.apk 180

  publish:
    needs: [plan, sign, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the signed APKs and AAB
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: yap-qt-${{ needs.plan.outputs.version }}
          path: out

      # The files as the sign job made them (the smoke job ran in between).
      - name: Check the APKs and AAB
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          SHA256_ARM64: ${{ needs.sign.outputs.sha256_arm64 }}
          SHA256_X86_64: ${{ needs.sign.outputs.sha256_x86_64 }}
          SHA256_AAB: ${{ needs.sign.outputs.sha256_aab }}
        run: |
          printf '%s  %s\n' "$SHA256_ARM64" "yap-qt-$VERSION-arm64-v8a.apk" \
            "$SHA256_X86_64" "yap-qt-$VERSION-x86_64.apk" \
            "$SHA256_AAB" "yap-qt-$VERSION.aab" >expected.sha256
          if [ "$(wc -l <expected.sha256)" -ne 3 ] || grep -qv '^[0-9a-f]\{64\}  ' expected.sha256; then
            echo "::error::the sign job's SHA-256 outputs are missing"
            exit 1
          fi
          (cd out && sha256sum -c ../expected.sha256 && sha256sum -c ./*.sha256)

      # Release mode: release-please's draft gets the APKs and a footer under
      # its changelog, then is published as a pre-release that never becomes
      # GitHub's latest (the desktop's releases own that). A rerun uploads
      # again and replaces the footer.
      - name: Publish the release
        if: ${{ needs.plan.outputs.mode == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          ids="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | [.id, .draft] | @tsv")"
          if [ "$(grep -c . <<<"$ids")" -ne 1 ] || [ "$(cut -f 2 <<<"$ids")" != true ]; then
            echo "::error::Expected one draft release for $TAG, found: ${ids:-none}"
            exit 1
          fi
          id="$(cut -f 1 <<<"$ids")"
          # The tag still names the commit built (the ruleset on
          # qt-android-v* also stops it moving).
          ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')"
          target="${ref#* }"
          if [ "${ref%% *}" = tag ]; then
            target="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$target" --jq .object.sha)"
          fi
          if [ "$target" != "$SHA" ]; then
            echo "::error::$TAG now points at $target, not the commit built ($SHA)"
            exit 1
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber \
            out/*.apk out/*.apk.sha256 out/*.aab out/*.aab.sha256
          marker="<!-- qt-android-assets -->"
          gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq '.body // ""' >changelog.md
          awk -v m="$marker" '$0 == m { exit } { print }' changelog.md >notes.md
          cat >>notes.md <<EOF
          $marker
          ### Install

          - \`yap-qt-$VERSION-arm64-v8a.apk\`: phones. \`yap-qt-$VERSION-x86_64.apk\`: emulators.
          - \`yap-qt-$VERSION.aab\`: the App Bundle (both ABIs) for Google Play; not installable as it is.
          - Signed with the Yap for Android (Qt) release key, certificate SHA-256 \`$EXPECTED_CERT_SHA256\`. It installs over an earlier release build, not over a CI (debug-signed) build.
          - Each file's SHA-256 is in its \`.sha256\` file. Built from $SHA.
          EOF
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
            -f name="Yap for Android (Qt) $VERSION" -F body=@notes.md \
            -F draft=false -F prerelease=true -f make_latest=false \
            --jq '{name, tag_name, draft, prerelease, html_url, assets: [.assets[].name]}'

      # Manual mode: a draft pre-release, never published by this workflow.
      # A rerun uploads into its own draft again; a published release with
      # the tag is left alone.
      - name: Draft test build
        if: ${{ needs.plan.outputs.mode == 'manual' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          states="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | if .draft then \"draft\" else \"published\" end")"
          state="${states%%$'\n'*}"
          if [[ "$states" == *published* ]]; then state=published; fi
          if [ "$state" = published ]; then
            echo "::error::$TAG is already published"
            exit 1
          fi
          notes="Test build of the Qt app (dev.yap.app) from $SHA. A draft: delete it when done; release-please's qt-android-v<x.y.z> releases are the tester builds.

          - arm64-v8a: phones. x86_64: emulators. The .aab: the App Bundle for Google Play.
          - Signed with the Yap for Android (Qt) release key, certificate SHA-256 \`$EXPECTED_CERT_SHA256\`. It installs over an earlier release build, not over a CI (debug-signed) build.
          - Each file's SHA-256 is in its \`.sha256\` file."
          if [ -z "$state" ]; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --prerelease --latest=false \
              --target "$SHA" --title "Yap for Android (Qt) $VERSION" --notes "$notes"
          else
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --target "$SHA" --notes "$notes"
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber \
            out/*.apk out/*.apk.sha256 out/*.aab out/*.aab.sha256
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json name,isDraft,isPrerelease,assets \
            --jq '{name, isDraft, isPrerelease, assets: [.assets[].name]}'
