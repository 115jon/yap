name: "Qt Android Release"

# Builds of the Qt Quick app (desktop-native/mobile/qt, application id
# dev.yap.app), signed with its release key (desktop-native/mobile/README.md,
# "Releases").
#
# Two modes:
#
# - Release (release_tag set): release-please's qt-android-v<x.y.z>.
#   release-please.yml creates that release when its Qt release PR is
#   merged, marks it a draft pre-release and calls this workflow with
#   release_tag. The run builds the tagged commit (its VERSION must be
#   x.y.z), attaches the APKs to that draft (release-please's changelog is
#   the notes) and publishes it as a pre-release, never GitHub's latest. A
#   manual dispatch from main with release_tag rebuilds a release whose
#   call failed (it must still be a draft).
# - Manual (no release_tag, dispatch only): a test build of the commit the
#   run starts on, version <VERSION>-build.<run>, uploaded to a draft
#   pre-release qt-android-v<that version>. Drafts create no tag; delete
#   the draft when done with it.
#
# Jobs and what each can reach:
# - plan: the mode, the commit, the version and the version codes. Write
#   only so the release list includes drafts; it runs no repository code.
# - build: compiles the core and the APKs (third-party crates' build
#   scripts run here), unsigned. Only the Firebase client configuration,
#   which ends up inside the APK anyway. No caches: a release builds from
#   clean sources, and fetch-qt.ps1 checks each Qt archive it downloads
#   against qt-sdk.lock.json's SHA-256.
# - sign: the release key, from the android-release environment, whose
#   deployment policy admits refs/heads/main only (release-please.yml's
#   call and dispatches from main both run there). It runs only the
#   repository's sign.sh and the SDK's zipalign, apksigner and aapt2 on the
#   unsigned APKs, checks the certificate, the application id and the
#   version, and deletes the key. No write token. The signed APKs' SHA-256s
#   are its outputs.
# - smoke: the signed x86_64 APK cold-started on an emulator.
# - publish: the release (contents: write), after checking the APKs against
#   the sign job's SHA-256s. No key.
#
# Who can have a commit signed: whoever can merge to main (the release PR,
# or any commit a dispatch from main builds) or start this workflow on
# main. qt-android-v* tags are release-please's (a repository ruleset lets
# only admins create, move or delete them). This workflow has no tag
# trigger, and the plan job refuses any ref but refs/heads/main.
#
# Version codes: (2000000 + minutes since 2026-01-01 UTC) * 10 + the ABI
# digit (2 arm64-v8a, 4 x86_64), from the plan job's clock: every build is
# above the one before, whichever workflow run started it, and above the
# earlier (1000000 + run) * 10 + digit release builds and every CI build of
# desktop-native-mobile.yml (run * 10 + digit). The run number cannot be
# used: a called workflow sees the caller's.
on:
  workflow_call:
    inputs:
      release_tag:
        description: "The release-please tag to build and publish (qt-android-v<x.y.z>); its release must be a draft"
        required: true
        type: string
    secrets:
      QT_GOOGLE_SERVICES_JSON_BASE64:
        required: true
      # The release key, read only by the sign job. They are android-release
      # environment secrets: the caller (a job without an environment)
      # passes them by name, never `inherit`, but its values are empty, and
      # in the sign job, which has `environment: android-release`, GitHub
      # uses the environment's secrets instead of the caller's. Not
      # required, so empty caller values cannot fail the call; the sign job
      # fails on an empty key.
      QT_ANDROID_KEYSTORE_BASE64:
        required: false
      QT_ANDROID_KEYSTORE_PASSWORD:
        required: false
      QT_ANDROID_KEY_ALIAS:
        required: false
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Rebuild a release-please release whose run failed: its tag (qt-android-v<x.y.z>; the release must still be a draft). Empty: a test build of this commit, uploaded to a draft."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  # One run per release tag; manual test builds queue per ref.
  group: qt-android-release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    # bash -eo pipefail
    shell: bash

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # SHA-256 of the release certificate (alias yapapp). The sign job fails
  # if an APK carries any other.
  EXPECTED_CERT_SHA256: "75:E0:D8:E0:22:4A:9F:32:D8:CC:40:C7:B9:5A:E7:82:43:B3:97:21:5A:99:C1:FE:D6:01:50:FC:6E:FF:B8:9C"
  APP_ID: dev.yap.app
  BUILD_TOOLS: 36.0.0

jobs:
  plan:
    if: ${{ github.repository == '115jon/yap' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Write only so the release list includes drafts (release-please's
      # draft in release mode, an earlier test build's in manual mode).
      contents: write
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      code_base: ${{ steps.plan.outputs.code_base }}
    steps:
      # Release mode builds the tag release-please made; manual runs the
      # commit they were started on.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Mode, commit, version and version codes
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
        run: |
          base="$(head -n 1 desktop-native/mobile/qt/VERSION)"
          if ! [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::desktop-native/mobile/qt/VERSION must be x.y.z, got '$base'"
            exit 1
          fi
          # The signing environment admits main only; fail here, before the
          # build, rather than at the sign job.
          if [ "$GIT_REF" != refs/heads/main ]; then
            echo "::error::A signed build runs from main (the android-release environment admits refs/heads/main only); this run is on $GIT_REF."
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          releases="$(gh api "repos/$REPO/releases?per_page=100" --paginate \
            --jq '.[] | [.tag_name, (if .draft then "draft" else "published" end)] | @tsv')"
          if [ -n "$RELEASE_TAG" ]; then
            mode=release
            tag="$RELEASE_TAG"
            if ! [[ "$tag" =~ ^qt-android-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "::error::release_tag '$tag' is not qt-android-v<x.y.z>"
              exit 1
            fi
            version="${BASH_REMATCH[1]}"
            if [ "$version" != "$base" ]; then
              echo "::error::release_tag $tag does not match desktop-native/mobile/qt/VERSION ($base) at that tag"
              exit 1
            fi
            git fetch -q --no-tags origin main
            if ! git merge-base --is-ancestor "$sha" FETCH_HEAD; then
              echo "::error::tag $tag is not on main"
              exit 1
            fi
            states="$(awk -F '\t' -v t="$tag" '$1 == t { print $2 }' <<<"$releases")"
            if [ "$states" != draft ]; then
              echo "::error::Expected one draft release for $tag, found: ${states:-none}. To rebuild a published one, make it a draft first (gh release edit $tag --draft=true)."
              exit 1
            fi
            # The build's version code would be above a newer published
            # release's, so testers on that one would "update" to an older
            # version.
            newest="$(awk -F '\t' '$2 == "published" && $1 ~ /^qt-android-v[0-9]+\.[0-9]+\.[0-9]+$/ { sub(/^qt-android-v/, "", $1); print $1 }' <<<"$releases" | sort -V | tail -n 1)"
            if [ -n "$newest" ] && [ "$newest" != "$version" ] &&
              [ "$(printf '%s\n%s\n' "$newest" "$version" | sort -V | tail -n 1)" = "$newest" ]; then
              echo "::error::qt-android-v$newest is already published, newer than $tag; release a newer version instead."
              exit 1
            fi
          else
            mode=manual
            if [ "$EVENT_NAME" != workflow_dispatch ]; then
              echo "::error::Without release_tag this workflow runs only by hand."
              exit 1
            fi
            version="$base-build.$GITHUB_RUN_NUMBER"
            tag="qt-android-v$version"
            if awk -F '\t' -v t="$tag" '$1 == t && $2 == "published" { found = 1 } END { exit !found }' <<<"$releases"; then
              echo "::error::$tag is already published"
              exit 1
            fi
          fi
          minutes=$(( ($(date -u +%s) - 1767225600) / 60 ))
          {
            echo "mode=$mode"
            echo "sha=$sha"
            echo "version=$version"
            echo "tag=$tag"
            echo "code_base=$(( (2000000 + minutes) * 10 ))"
          } >>"$GITHUB_OUTPUT"
          echo "$mode: version $version, tag $tag, commit $sha"

  build:
    name: build (${{ matrix.abi }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: true
      matrix:
        include:
          - abi: arm64-v8a
            rust: aarch64-linux-android
            qt: android-arm64_v8a
            qt_dir: android_arm64_v8a
            digit: 2
          - abi: x86_64
            rust: x86_64-linux-android
            qt: android-x86_64
            qt_dir: android_x86_64
            digit: 4
    env:
      YAPM: ${{ github.workspace }}/.yapm
      QT_HOST_PATH: ${{ github.workspace }}/.yapm/qt/gcc_64
      QT_TARGET_ROOT: ${{ github.workspace }}/.yapm/qt/${{ matrix.qt_dir }}
      # The NDK Qt 6.11.3 for Android was built with (r27c).
      NDK_VERSION: 27.2.12479018
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-10-16)
        with:
          targets: ${{ matrix.rust }}

      - name: JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - name: Ninja and 7-Zip
        # Skipped when the image has both. Otherwise retried: an unreachable
        # mirror (security.ubuntu.com has failed to resolve on the runners)
        # must not fail the build when the main archive answers.
        run: |
          if command -v ninja >/dev/null && command -v 7z >/dev/null; then
            ninja --version; exit 0
          fi
          for attempt in 1 2 3 4; do
            sudo apt-get update -qq -o Acquire::Retries=3 || true
            if sudo apt-get install -y -qq -o Acquire::Retries=3 ninja-build p7zip-full; then
              exit 0
            fi
            sleep $((attempt * 15))
          done
          exit 1

      - name: Android NDK, platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$NDK_VERSION" "platforms;android-36" "build-tools;$BUILD_TOOLS" >/dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >>"$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >>"$GITHUB_ENV"

      - name: Qt 6.11.3 (host and target)
        shell: pwsh
        run: |
          ./desktop-native/mobile/qt/fetch-qt.ps1 -Dest .yapm/qt -DownloadDir .yapm/qt-download `
            -Set host-linux,${{ matrix.qt }}

      # Push notifications need the dev.yap.app Firebase client
      # (android/build.gradle). A release without it would ship without
      # pushes, so it fails instead.
      - name: Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.QT_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::QT_GOOGLE_SERVICES_JSON_BASE64 is not set"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/firebase"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d >"$RUNNER_TEMP/firebase/google-services.json"
          echo "YAP_GOOGLE_SERVICES_JSON=$RUNNER_TEMP/firebase/google-services.json" >>"$GITHUB_ENV"

      - name: Build the APK (${{ matrix.abi }}, release)
        env:
          CODE: ${{ needs.plan.outputs.code_base }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          bash desktop-native/mobile/qt/build.sh ${{ matrix.abi }} Release \
            -DYAP_ANDROID_APP_ID="$APP_ID" \
            -DYAP_ANDROID_VERSION_CODE="$(( CODE + ${{ matrix.digit }} ))" \
            -DYAP_ANDROID_VERSION_NAME="$VERSION" \
            -DYAP_ANDROID_COMPILE_SDK=android-36 \
            -DYAP_ANDROID_BUILD_TOOLS="$BUILD_TOOLS"
          mkdir -p unsigned
          cp "$YAPM/build/qt-${{ matrix.abi }}-Release/android-build/build/outputs/apk/release/android-build-release-unsigned.apk" \
            "unsigned/yap-qt-${{ matrix.abi }}-unsigned.apk"

      - name: Remove the Firebase configuration
        if: always()
        run: rm -rf "$RUNNER_TEMP/firebase"

      - name: Upload the unsigned APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-${{ matrix.abi }}
          path: unsigned/yap-qt-${{ matrix.abi }}-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds the release key's secrets; its deployment policy admits
    # refs/heads/main only.
    environment: android-release
    outputs:
      sha256_arm64: ${{ steps.sign.outputs.sha256_arm64 }}
      sha256_x86_64: ${{ steps.sign.outputs.sha256_x86_64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
          sparse-checkout: desktop-native/mobile/qt/sign.sh
          sparse-checkout-cone-mode: false

      - name: Build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;$BUILD_TOOLS" >/dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >>"$GITHUB_ENV"

      - name: Download the unsigned APKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: unsigned-*
          merge-multiple: true
          path: unsigned

      - name: Decode the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.QT_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::QT_ANDROID_KEYSTORE_BASE64 is not available to this run"
            exit 1
          fi
          mkdir -m 700 "$RUNNER_TEMP/key"
          (umask 077 && printf '%s' "$KEYSTORE_BASE64" | base64 -d >"$RUNNER_TEMP/key/release.p12")

      - name: Sign and check
        id: sign
        env:
          YAP_KEYSTORE_PASS: ${{ secrets.QT_ANDROID_KEYSTORE_PASSWORD }}
          YAP_KEY_ALIAS: ${{ secrets.QT_ANDROID_KEY_ALIAS }}
          VERSION: ${{ needs.plan.outputs.version }}
          CODE: ${{ needs.plan.outputs.code_base }}
        run: |
          export YAP_KEYSTORE="$RUNNER_TEMP/key/release.p12" YAP_BUILD_TOOLS="$BUILD_TOOLS"
          bt="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          expected="$(echo "$EXPECTED_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')"
          mkdir -p out
          for abi_digit in arm64-v8a:2 x86_64:4; do
            abi="${abi_digit%%:*}" digit="${abi_digit##*:}"
            apk="out/yap-qt-$VERSION-$abi.apk"
            bash desktop-native/mobile/qt/sign.sh "unsigned/yap-qt-$abi-unsigned.apk" "$apk"
            certs="$("$bt/apksigner" verify --min-sdk-version 28 --print-certs "$apk")"
            echo "$certs"
            actual="$(echo "$certs" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
            if [ "$actual" != "$expected" ] || [ "$(echo "$certs" | grep -c '^Signer #[0-9]* certificate DN:')" -ne 1 ]; then
              echo "::error::$apk is not signed with the release certificate alone (got ${actual:-none})"
              exit 1
            fi
            badging="$("$bt/aapt2" dump badging "$apk" | head -n 1)"
            echo "$badging"
            want="package: name='$APP_ID' versionCode='$(( CODE + digit ))' versionName='$VERSION'"
            if [[ "$badging" != "$want"* ]]; then
              echo "::error::$apk: expected \"$want\""
              exit 1
            fi
            echo "sha256_${abi%-v8a}=$(sha256sum "$apk" | cut -d ' ' -f 1)" >>"$GITHUB_OUTPUT"
          done
          ls -l out

      - name: Remove the release key
        if: always()
        run: rm -rf "$RUNNER_TEMP/key"

      - name: Upload the signed APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yap-qt-${{ needs.plan.outputs.version }}
          path: |
            out/*.apk
            out/*.apk.sha256
          if-no-files-found: error
          # Public (the repository is): keep it no longer than the run needs.
          retention-days: 1

  # The signed x86_64 APK cold-started on an emulator (API 35), as CI's
  # qt-android-smoke does with the debug-signed one.
  smoke:
    needs: [plan, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Download the signed APKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: yap-qt-${{ needs.plan.outputs.version }}
          path: out

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cold start on an emulator
        # ReactiveCircus/android-emulator-runner v2.38.0
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: YAP_ANDROID_APP_ID=${{ env.APP_ID }} bash desktop-native/mobile/qt/smoke.sh out/yap-qt-${{ needs.plan.outputs.version }}-x86_64.apk 180

  publish:
    needs: [plan, sign, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the signed APKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: yap-qt-${{ needs.plan.outputs.version }}
          path: out


      # The APKs as the sign job made them (the smoke job ran in between).
      - name: Check the APKs
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          SHA256_ARM64: ${{ needs.sign.outputs.sha256_arm64 }}
          SHA256_X86_64: ${{ needs.sign.outputs.sha256_x86_64 }}
        run: |
          printf '%s  %s\n' "$SHA256_ARM64" "yap-qt-$VERSION-arm64-v8a.apk" \
            "$SHA256_X86_64" "yap-qt-$VERSION-x86_64.apk" >expected.sha256
          if [ "$(wc -l <expected.sha256)" -ne 2 ] || grep -qv '^[0-9a-f]\{64\}  ' expected.sha256; then
            echo "::error::the sign job's SHA-256 outputs are missing"
            exit 1
          fi
          (cd out && sha256sum -c ../expected.sha256 && sha256sum -c ./*.sha256)

      # Release mode: release-please's draft gets the APKs and a footer under
      # its changelog, then is published as a pre-release that never becomes
      # GitHub's latest (the desktop's releases own that). A rerun uploads
      # again and replaces the footer.
      - name: Publish the release
        if: ${{ needs.plan.outputs.mode == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          ids="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | [.id, .draft] | @tsv")"
          if [ "$(grep -c . <<<"$ids")" -ne 1 ] || [ "$(cut -f 2 <<<"$ids")" != true ]; then
            echo "::error::Expected one draft release for $TAG, found: ${ids:-none}"
            exit 1
          fi
          id="$(cut -f 1 <<<"$ids")"
          # The tag still names the commit built (the ruleset on
          # qt-android-v* also stops it moving).
          ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')"
          target="${ref#* }"
          if [ "${ref%% *}" = tag ]; then
            target="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$target" --jq .object.sha)"
          fi
          if [ "$target" != "$SHA" ]; then
            echo "::error::$TAG now points at $target, not the commit built ($SHA)"
            exit 1
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber out/*.apk out/*.apk.sha256
          marker="<!-- qt-android-assets -->"
          gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq '.body // ""' >changelog.md
          awk -v m="$marker" '$0 == m { exit } { print }' changelog.md >notes.md
          cat >>notes.md <<EOF
          $marker
          ### Install

          - \`yap-qt-$VERSION-arm64-v8a.apk\`: phones. \`yap-qt-$VERSION-x86_64.apk\`: emulators.
          - Signed with the Yap for Android (Qt) release key, certificate SHA-256 \`$EXPECTED_CERT_SHA256\`. It installs over an earlier release build, not over a CI (debug-signed) build.
          - Each APK's SHA-256 is in its \`.sha256\` file. Built from $SHA.
          EOF
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
            -f name="Yap for Android (Qt) $VERSION" -F body=@notes.md \
            -F draft=false -F prerelease=true -f make_latest=false \
            --jq '{name, tag_name, draft, prerelease, html_url, assets: [.assets[].name]}'

      # Manual mode: a draft pre-release, never published by this workflow.
      # A rerun uploads into its own draft again; a published release with
      # the tag is left alone.
      - name: Draft test build
        if: ${{ needs.plan.outputs.mode == 'manual' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          states="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | if .draft then \"draft\" else \"published\" end")"
          state="${states%%$'\n'*}"
          if [[ "$states" == *published* ]]; then state=published; fi
          if [ "$state" = published ]; then
            echo "::error::$TAG is already published"
            exit 1
          fi
          notes="Test build of the Qt app (dev.yap.app) from $SHA. A draft: delete it when done; release-please's qt-android-v<x.y.z> releases are the tester builds.

          - arm64-v8a: phones. x86_64: emulators.
          - Signed with the Yap for Android (Qt) release key, certificate SHA-256 \`$EXPECTED_CERT_SHA256\`. It installs over an earlier release build, not over a CI (debug-signed) build.
          - Each APK's SHA-256 is in its \`.sha256\` file."
          if [ -z "$state" ]; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --prerelease --latest=false \
              --target "$SHA" --title "Yap for Android (Qt) $VERSION" --notes "$notes"
          else
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --target "$SHA" --notes "$notes"
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber out/*.apk out/*.apk.sha256
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json name,isDraft,isPrerelease,assets \
            --jq '{name, isDraft, isPrerelease, assets: [.assets[].name]}'
