name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR pushes are cancelled. Runs on main are allowed to finish
  # because they refresh the main-scoped pnpm cache that every PR restores from.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      # unit, worker-runtime, and build run for pull requests that touch code
      # and for manual runs. Pushes to main skip them: branch protection
      # requires `required` with strict up-to-date branches, and admins are
      # included, so every commit on main is the tree its PR already tested.
      code: ${{ steps.manual.outputs.code || steps.filter.outputs.code || 'false' }}
      # rust-shared runs when the Rust the web shares changes.
      rust: ${{ steps.manual.outputs.code || steps.filter.outputs.rust || 'false' }}
    steps:
      - name: Mark all files as relevant for manual runs
        id: manual
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "code=true" >> "$GITHUB_OUTPUT"

      - name: Detect code-affecting changes
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        # For pull_request events paths-filter lists changed files through the
        # GitHub API, so this job does not need a checkout.
        # dorny/paths-filter v3.0.4
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad
        with:
          filters: |
            code:
              - 'src/**'
              - 'realtime/**'
              - 'scripts/**'
              - 'public/**'
              - 'migrations/**'
              - 'patches/**'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.mjs'
              - '**/*.cjs'
              - '**/*.json'
              - '**/*.toml'
              - '**/*.yaml'
              - '**/*.yml'
              - '**/*.sql'
              - '**/*.css'
              - '**/*.scss'
              - '**/*.html'
              - '**/*.svg'
              - '.npmrc'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            rust:
              - 'native/rust/Cargo.toml'
              - 'native/rust/crates/yap-protocol/**'
              - 'native/rust/crates/yap-core/**'
              - 'native/rust/crates/yap-cache/**'
              - 'packages/rust/**'
              - 'packages/protocol/src/generated/**'
              - '.github/workflows/ci.yml'

  rust-shared:
    name: rust-shared
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm workspace
        uses: ./.github/actions/setup-pnpm

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --target wasm32-unknown-unknown
          rustup default stable

      # packages/protocol/src/generated is written from yap-protocol's Rust
      # types (packages/rust/protocol-ts). Regenerate and fail on any change,
      # so a Rust wire change cannot land without its TypeScript.
      - name: Check generated protocol types
        run: |
          pnpm run protocol:generate
          git add --intent-to-add packages/protocol/src/generated
          git diff --exit-code -- packages/protocol/src/generated || {
            echo "::error::packages/protocol/src/generated is stale: run pnpm protocol:generate and commit the result."
            exit 1
          }

      - name: Clippy
        run: cargo clippy --manifest-path packages/rust/Cargo.toml --all-targets -- -D warnings

      # yap-core without its `runtime` feature (the store and the rules
      # modules) must build for the browser: no tokio, reqwest, keyring or
      # SQLite in it. packages/rust/yap-core-wasm depends on exactly that.
      # A check, not clippy: clippy lints only workspace members, and the
      # native crates are path dependencies here. RUSTFLAGS turns their
      # rustc warnings (dead code once I/O is gone, say) into errors.
      - name: Check yap-core's pure half builds for wasm
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --manifest-path packages/rust/Cargo.toml -p yap-core-wasm --target wasm32-unknown-unknown

  quality:
    name: quality
    # Runs on main too: it is cheap, and its install keeps the main-scoped
    # pnpm store cache current after lockfile changes.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm workspace
        uses: ./.github/actions/setup-pnpm

      # The native apps moved from desktop-native/ to native/. A branch that
      # predates the move can bring the old folder back on a rebase.
      - name: Check that desktop-native/ is gone
        run: test ! -e desktop-native

      # The native release builds with cargo --locked, and release-please
      # bumps native/rust/Cargo.toml without Cargo.lock: a release PR
      # whose lock sync (release-please.yml) has not landed fails here.
      - name: Check native Cargo.lock
        run: node native/tools/sync-cargo-lock-version.mjs --check --also native/mobile/rust/Cargo.lock

      - name: Check formatting
        run: pnpm run format:check

      - name: Run lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

  unit:
    name: unit
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm workspace
        uses: ./.github/actions/setup-pnpm

      - name: Run unit tests
        # The range-probe suite contacts YouTube and is an explicit live probe,
        # not a deterministic unit test. Keep it opt-in so CI is repeatable.
        run: pnpm exec vitest run --exclude src/lib/__tests__/ytdlp-range-probe.live.test.ts

  worker-runtime:
    name: worker-runtime
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm workspace
        uses: ./.github/actions/setup-pnpm

      - name: Configure deterministic Worker test secrets
        shell: bash
        run: |
          cat > .dev.vars <<'EOF'
          CALLS_APP_SECRET=ci-test-only-value
          TURN_TOKEN_SECRET=ci-test-only-value
          REALTIME_TICKET_SECRET=ci-test-only-value
          EOF

      - name: Run Worker tests
        run: pnpm run test:worker

  build:
    name: build
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm workspace
        uses: ./.github/actions/setup-pnpm

      - name: Build production output
        run: pnpm run build

  required:
    name: required
    if: ${{ always() }}
    needs:
      - changes
      - quality
      - unit
      - worker-runtime
      - build
      - rust-shared
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          WORKER_RESULT: ${{ needs.worker-runtime.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          RUST_RESULT: ${{ needs.rust-shared.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" || \
            "$QUALITY_RESULT" != "success" || \
            ( "$UNIT_RESULT" != "success" && "$UNIT_RESULT" != "skipped" ) || \
            ( "$WORKER_RESULT" != "success" && "$WORKER_RESULT" != "skipped" ) || \
            ( "$BUILD_RESULT" != "success" && "$BUILD_RESULT" != "skipped" ) || \
            ( "$RUST_RESULT" != "success" && "$RUST_RESULT" != "skipped" ) ]]; then
            echo "CI failed: changes=$CHANGES_RESULT quality=$QUALITY_RESULT unit=$UNIT_RESULT worker=$WORKER_RESULT build=$BUILD_RESULT rust-shared=$RUST_RESULT"
            exit 1
          fi
