name: "Desktop Native Mobile Prototype"

# The mobile prototypes on the native core (desktop-native/mobile/README.md).
#
# - android, ios-bindings: the Compose baseline, the desktop crates behind
#   UniFFI. Android builds the APK the emulator runs; iOS checks that the
#   core cross-compiles and that the generated Swift bindings type-check.
# - qt-android: the Qt Quick app (desktop-native/mobile/qt) for x86_64 and
#   arm64-v8a, signed, as artifacts. Qt comes from download.qt.io, pinned by
#   mobile/qt/qt-sdk.lock.json.
# - qt-ios: the same CMake project for the iOS simulator, a compile and link
#   check (no signing, no run). It runs when mobile/qt changes, by hand, and
#   weekly, not for every core change.
#
# Nothing here touches the Expo app (apps/mobile) or its releases.
on:
  pull_request:
    paths:
      - ".github/workflows/desktop-native-mobile.yml"
      - "desktop-native/mobile/**"
      - "desktop-native/rust/Cargo.toml"
      - "desktop-native/rust/Cargo.lock"
      - "desktop-native/rust/crates/**"
      # The Qt app embeds the desktop's fonts and icons; its iOS check scans
      # the desktop QML for the QML plugins to link.
      - "desktop-native/rust/qml/**"
      - "desktop-native/assets/**"
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: desktop-native-mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      # Manual and scheduled runs build everything.
      uniffi: ${{ steps.filter.outputs.uniffi || 'true' }}
      qt: ${{ steps.filter.outputs.qt || 'true' }}
      ios: ${{ steps.filter.outputs.ios || 'true' }}
    steps:
      - name: Detect what changed
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        # dorny/paths-filter v3.0.4
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad
        with:
          filters: |
            uniffi:
              - '.github/workflows/desktop-native-mobile.yml'
              - 'desktop-native/mobile/android/**'
              - 'desktop-native/mobile/rust/**'
              - 'desktop-native/mobile/common/**'
              - 'desktop-native/mobile/build.sh'
              - 'desktop-native/rust/Cargo.toml'
              - 'desktop-native/rust/Cargo.lock'
              - 'desktop-native/rust/crates/**'
              - 'desktop-native/rust/src/client/gateway.rs'
            qt:
              - '.github/workflows/desktop-native-mobile.yml'
              - 'desktop-native/mobile/qt/**'
              - 'desktop-native/mobile/common/**'
              - 'desktop-native/rust/Cargo.toml'
              - 'desktop-native/rust/Cargo.lock'
              - 'desktop-native/rust/crates/**'
              - 'desktop-native/rust/qml/**'
              - 'desktop-native/rust/src/models.rs'
              - 'desktop-native/cpp/**'
              - 'desktop-native/assets/**'
            ios:
              - '.github/workflows/desktop-native-mobile.yml'
              - 'desktop-native/mobile/qt/**'

  android:
    needs: changes
    if: ${{ needs.changes.outputs.uniffi == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-10-16)
        with:
          targets: x86_64-linux-android

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked --version 4.1.2

      # Gradle 8.13 does not run on the image's default JDK 25.
      - name: JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      # The runner image carries the SDK (ANDROID_HOME) and its newest NDK;
      # build.sh picks the newest NDK under the SDK.
      - name: Build the core, bindings and APK (x86_64, release)
        run: bash desktop-native/mobile/build.sh x86_64 release

      - name: Sizes
        run: |
          ls -l desktop-native/mobile/android/app/src/main/jniLibs/x86_64/libyap_mobile.so
          ls -l desktop-native/mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload the APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yap-core-proto-x86_64
          path: desktop-native/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

  ios-bindings:
    needs: changes
    if: ${{ needs.changes.outputs.uniffi == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop-native/mobile/rust
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-10-16)
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Cross-compile the core (device and simulator)
        run: |
          cargo build --lib --release --target aarch64-apple-ios
          cargo build --lib --release --target aarch64-apple-ios-sim
          ls -l target/aarch64-apple-ios/release/libyap_mobile.a

      # Bindings come from a host build (the metadata is the same).
      - name: Generate the Swift bindings
        run: |
          cargo build --lib
          cargo run -q --bin uniffi-bindgen -- generate --library target/debug/libyap_mobile.dylib \
            --language swift --out-dir "$RUNNER_TEMP/swift"

      - name: Type-check the bindings for the iOS simulator
        run: |
          xcrun --sdk iphonesimulator swiftc -typecheck \
            -target arm64-apple-ios17.0-simulator \
            -import-objc-header "$RUNNER_TEMP/swift/yap_mobileFFI.h" \
            "$RUNNER_TEMP/swift/yap_mobile.swift"

  qt-android:
    name: qt-android (${{ matrix.abi }})
    needs: changes
    if: ${{ needs.changes.outputs.qt == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The ABI digit of the version code (run * 10 + digit), so each
          # ABI's APK of one run has its own code, arm64 below x86_64.
          - abi: arm64-v8a
            rust: aarch64-linux-android
            qt: android-arm64_v8a
            qt_dir: android_arm64_v8a
            digit: 2
          - abi: x86_64
            rust: x86_64-linux-android
            qt: android-x86_64
            qt_dir: android_x86_64
            digit: 4
    env:
      YAPM: ${{ github.workspace }}/.yapm
      QT_HOST_PATH: ${{ github.workspace }}/.yapm/qt/gcc_64
      QT_TARGET_ROOT: ${{ github.workspace }}/.yapm/qt/${{ matrix.qt_dir }}
      # The NDK Qt 6.11.3 for Android was built with (r27c).
      NDK_VERSION: 27.2.12479018
      BUILD_TOOLS: 36.0.0
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-10-16)
        with:
          targets: ${{ matrix.rust }}

      - name: JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - name: Ninja and 7-Zip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build p7zip-full

      - name: Android NDK, platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$NDK_VERSION" "platforms;android-36" "build-tools;$BUILD_TOOLS" >/dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >>"$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >>"$GITHUB_ENV"

      # The archives only (about 50 MB per set); unpacking them is quick.
      - name: Cache the Qt archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .yapm/qt-download
          key: qt-sdk-${{ matrix.qt }}-host-linux-${{ hashFiles('desktop-native/mobile/qt/qt-sdk.lock.json') }}

      - name: Qt 6.11.3 (host and target)
        shell: pwsh
        run: |
          ./desktop-native/mobile/qt/fetch-qt.ps1 -Dest .yapm/qt -DownloadDir .yapm/qt-download `
            -Set host-linux,${{ matrix.qt }}

      # Swatinem/rust-cache v2.9.3. Corrosion's target folder is inside the
      # CMake build tree (build.sh: $YAPM/build/qt-<abi>-Release).
      - name: Cargo cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: qt-${{ matrix.abi }}
          workspaces: desktop-native/mobile/qt/rust -> ../../../../.yapm/build/qt-${{ matrix.abi }}-Release/cargo/build

      - name: Build the APK (${{ matrix.abi }}, release)
        env:
          RUN: ${{ github.run_number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          code=$(( RUN * 10 + ${{ matrix.digit }} ))
          bash desktop-native/mobile/qt/build.sh ${{ matrix.abi }} Release \
            -DYAP_ANDROID_VERSION_CODE="$code" \
            -DYAP_ANDROID_VERSION_NAME="0.1.$RUN+${SHA::7}"

      # Pull requests sign with a throwaway key made here: the APK installs
      # for testing, and no key leaves the job.
      - name: Sign
        run: |
          keystore="$RUNNER_TEMP/ci-debug.keystore"
          keytool -genkeypair -keystore "$keystore" -storepass android -keypass android \
            -alias ci -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Yap CI throwaway" >/dev/null
          mkdir -p out
          YAP_KEYSTORE="$keystore" YAP_KEY_ALIAS=ci YAP_BUILD_TOOLS="$BUILD_TOOLS" \
            bash desktop-native/mobile/qt/sign.sh \
            "$YAPM/build/qt-${{ matrix.abi }}-Release/android-build/build/outputs/apk/release/android-build-release-unsigned.apk" \
            "out/yap-qt-${{ matrix.abi }}.apk"

      - name: Sizes
        run: |
          apk="out/yap-qt-${{ matrix.abi }}.apk"
          echo "APK $(stat -c %s "$apk") bytes, gzip -9 $(gzip -9 -c "$apk" | wc -c) bytes"
          unzip -lv "$apk" | awk 'NR > 3 && $8 ~ /\.(so|dex)$/ { printf "%10d %10d  %s\n", $1, $3, $8 }' | sort -rn

      - name: Upload the APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yap-qt-${{ matrix.abi }}
          path: |
            out/yap-qt-${{ matrix.abi }}.apk
            out/yap-qt-${{ matrix.abi }}.apk.sha256
          retention-days: 14

  qt-ios:
    needs: changes
    if: ${{ needs.changes.outputs.ios == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      YAPM: ${{ github.workspace }}/.yapm
      QT_HOST_PATH: ${{ github.workspace }}/.yapm/qt/macos
      QT_TARGET_ROOT: ${{ github.workspace }}/.yapm/qt/ios
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Qt for iOS has arm64 device and x86_64 simulator slices only, so the
      # simulator build is x86_64.
      - name: Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-10-16)
        with:
          targets: x86_64-apple-ios

      - name: Ninja and 7-Zip
        run: |
          command -v ninja >/dev/null || brew install ninja
          command -v 7z >/dev/null || command -v 7zz >/dev/null || brew install sevenzip

      - name: Cache the Qt archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .yapm/qt-download
          key: qt-sdk-ios-host-mac-${{ hashFiles('desktop-native/mobile/qt/qt-sdk.lock.json') }}

      - name: Qt 6.11.3 (host and iOS)
        shell: pwsh
        run: |
          ./desktop-native/mobile/qt/fetch-qt.ps1 -Dest .yapm/qt -DownloadDir .yapm/qt-download -Set host-mac,ios

      - name: Cargo cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: qt-ios-simulator
          workspaces: desktop-native/mobile/qt/rust -> ../../../../.yapm/build/qt-ios-simulator-Release/cargo/build

      - name: Build for the iOS simulator (x86_64, release)
        run: bash desktop-native/mobile/qt/build.sh ios-simulator Release

      - name: Size
        run: du -sh "$YAPM"/build/qt-ios-simulator-Release/*.app
