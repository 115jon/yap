name: "Desktop Native Release"

# Builds the native client (desktop-native/), packs it into a per-user
# Velopack installer, signs it and keeps it as a workflow artifact. Nothing
# is published to a release. See desktop-native/docs/INSTALLER.md.
#
# Manual only: it never runs on push or from another workflow.
#
# Toolchain it needs:
# - a static Qt 6.6.3 (-static -static-runtime, MSVC x64). No public action
#   ships one. On GitHub-hosted runners it is downloaded from the
#   `native-build-assets` release (asset qt-6.6.3-static-msvc-x64.zip, with
#   bin/qmake.exe at its root); until that asset is uploaded, use a
#   self-hosted runner whose YAP_QT_DIR points at the build.
# - LiveKit's prebuilt libwebrtc: webrtc-sys downloads it (about 430 MB)
#   unless YAP_LIBWEBRTC_DIR is set on a self-hosted runner.
# - MSVC, CMake and Ninja (on windows-latest), Rust stable, the .NET SDK for
#   vpk only.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (empty: [workspace.package] in desktop-native/rust/Cargo.toml)"
        required: false
        default: ""
        type: string
      runner:
        description: "github-hosted needs the static Qt asset; self-hosted needs YAP_QT_DIR on the runner"
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - self-hosted
      sign:
        description: "Authenticode-sign through Azure Artifact Signing"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  # Signer common name on the Artifact Signing public-trust certificate.
  ARTIFACT_SIGNING_SIGNER: "Jonathan Martinez"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  package:
    permissions:
      contents: read
      # OIDC token for azure/login (Artifact Signing). No Azure secret is stored.
      id-token: write
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJSON('["self-hosted","windows","x64","yap-native"]') || 'windows-latest' }}
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-10-16)

      - name: Rust cache
        if: inputs.runner == 'github-hosted'
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop-native/rust -> target
          cache-targets: false
          cache-bin: false

      # The dependency audit (desktop-native/rust/deny.toml; LIBRARIES.md
      # §18): RustSec advisories, licences, bans and sources. It runs before
      # the long build so a new advisory stops the package early. The
      # [patch] path crates must exist for cargo metadata (vendor.ps1;
      # build.ps1 then finds them up to date).
      - name: Dependency audit (cargo deny)
        run: |
          cargo install cargo-deny --locked --version 0.20.2
          ./desktop-native/patches/vendor.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Push-Location desktop-native/rust
          cargo deny check
          $code = $LASTEXITCODE
          Pop-Location
          exit $code

      # A static Qt is not something an action can install. The hosted path
      # takes a prepared archive; the self-hosted runner brings its own.
      - name: Static Qt 6.6.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ("${{ inputs.runner }}" -eq "self-hosted") {
            if (-not $env:YAP_QT_DIR -or -not (Test-Path "$env:YAP_QT_DIR/bin/qmake.exe")) {
              throw "Self-hosted runner: set YAP_QT_DIR to a static Qt 6.6.3 (bin/qmake.exe)."
            }
            Write-Host "==> Qt at $env:YAP_QT_DIR"
            exit 0
          }
          $dir = "$env:RUNNER_TEMP\qt-static"
          gh release download native-build-assets --repo ${{ github.repository }} --pattern "qt-6.6.3-static-msvc-x64.zip" --dir "$env:RUNNER_TEMP"
          if ($LASTEXITCODE) {
            throw "No qt-6.6.3-static-msvc-x64.zip on the native-build-assets release. Upload one, or run with runner=self-hosted."
          }
          Expand-Archive "$env:RUNNER_TEMP\qt-6.6.3-static-msvc-x64.zip" -DestinationPath $dir
          if (-not (Test-Path "$dir/bin/qmake.exe")) { throw "The Qt archive has no bin/qmake.exe at its root." }
          "YAP_QT_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ninja
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja --no-progress -y }
          ninja --version

      - name: Setup .NET (vpk only)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      # The vpk that matches the velopack crate the exe links.
      - name: Install vpk
        run: |
          $v = [regex]::Match((Get-Content -Raw desktop-native/rust/Cargo.toml), '(?m)^velopack = "=([^"]+)"').Groups[1].Value
          if (-not $v) { throw "No pinned velopack version in desktop-native/rust/Cargo.toml" }
          dotnet tool install -g vpk --version $v
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build YapNative.exe
        run: |
          $env:YAP_NATIVE_BUILD_DIR = "$env:RUNNER_TEMP\yapn-build"
          ./desktop-native/build.ps1 -QtDir $env:YAP_QT_DIR -BuildDir $env:YAP_NATIVE_BUILD_DIR
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "YAP_NATIVE_BUILD_DIR=$env:YAP_NATIVE_BUILD_DIR" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # OIDC federated credential on the app registration in repo variable
      # AZURE_CLIENT_ID; it trusts this repo's main branch and v* tags only,
      # so dispatch from main. The service principal holds only Artifact
      # Signing Certificate Profile Signer (docs/desktop/code-signing.md).
      - name: Azure login for Artifact Signing
        if: inputs.sign
        uses: azure/login@053f7285eb20bf5469ef084617b0b24d3cec53fc # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # vpk signs every binary it packs (YapNative.exe, the stub, Update.exe,
      # Setup.exe) through the same account and profile, with the Azure CLI
      # session the login step left.
      - name: Pack with vpk
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          $pack = @{ SkipBuild = $true; BuildDir = $env:YAP_NATIVE_BUILD_DIR; OutDir = "$env:RUNNER_TEMP\yapn-installer" }
          if ("${{ inputs.version }}") { $pack.Version = "${{ inputs.version }}" }
          if ("${{ inputs.sign }}" -eq "true") { $pack.Sign = $true }
          ./desktop-native/tools/package.ps1 @pack

      - name: Verify signatures
        if: inputs.sign
        run: |
          $out = "$env:RUNNER_TEMP\yapn-installer"
          ./desktop/scripts/verify-authenticode.ps1 -ExpectedSigner $env:ARTIFACT_SIGNING_SIGNER -Path @(
            "$out\YapNative.App-win-Setup.exe"
          )

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: YapNative-installer-${{ github.run_number }}${{ inputs.sign && '-signed' || '-unsigned' }}
          path: |
            ${{ runner.temp }}/yapn-installer/*.exe
            ${{ runner.temp }}/yapn-installer/*.nupkg
            ${{ runner.temp }}/yapn-installer/*.zip
            ${{ runner.temp }}/yapn-installer/*.json
            ${{ runner.temp }}/yapn-installer/RELEASES*
            !${{ runner.temp }}/yapn-installer/signing-metadata.json
          if-no-files-found: error
          retention-days: 14
