name: "Desktop Native Release"

# Builds the native client (desktop-native/), signs it, packs it with
# Velopack and publishes it as a GitHub release that the in-app updater reads
# (desktop-native/docs/INSTALLER.md, "Updates" and "Publishing a release").
#
# Manual only. Tags are desktop-native-v<version>: never v*, which belong to
# the web app's release-please releases. Every native release is published
# with make_latest=false, because the Tauri app's updater reads
# releases/latest/download/latest.json.
#
# Signing uses the OIDC federated credentials on AZURE_CLIENT_ID, which
# trust refs/heads/main and v* tags only: a signed release must be
# dispatched from main. dry_run skips signing (so it works from any branch)
# and leaves the release as a draft, which never creates the tag.
#
# Toolchain: the static, patched Qt 6.11.3 and LiveKit's libwebrtc come from
# the release named in desktop-native/tools/toolchain.lock.json
# (tools/package-toolchain.ps1 makes it; tools/fetch-toolchain.ps1 checks
# and unpacks it).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.2.24 (win) or 0.2.25-beta.1 (beta). Its x.y.z must equal [workspace.package] in desktop-native/rust/Cargo.toml. Empty: that version."
        required: false
        default: ""
        type: string
      channel:
        description: "Update channel: win (stable) or beta"
        required: true
        default: win
        type: choice
        options:
          - win
          - beta
      notes:
        description: "Release notes (Markdown; shown in Settings > Desktop app). Empty: a default line."
        required: false
        default: ""
        type: string
      dry_run:
        description: "Dry run: no signing, publish only a draft release (any branch)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # One native release at a time: each one reads the previous release's feed.
  group: desktop-native-release
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  # Signer common name on the Artifact Signing public-trust certificate.
  ARTIFACT_SIGNING_SIGNER: "Jonathan Martinez"
  PACK_ID: Yap.App
  TAG_PREFIX: desktop-native-v

jobs:
  # Checks the inputs and works out the version and tag; no build yet.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      channel: ${{ steps.plan.outputs.channel }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Plan the release
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel || 'win' }}
          # Anything but a manual run is a dry run.
          DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}
        run: |
          $cargo = Get-Content -Raw desktop-native/rust/Cargo.toml
          $base = [regex]::Match($cargo, '(?m)^version = "(\d+\.\d+\.\d+)"').Groups[1].Value
          if (-not $base) { throw "No [workspace.package] version in desktop-native/rust/Cargo.toml" }
          $version = if ($env:INPUT_VERSION) { $env:INPUT_VERSION.Trim() } else { $base }
          $m = [regex]::Match($version, '^(\d+\.\d+\.\d+)(-[0-9A-Za-z.-]+)?$')
          if (-not $m.Success) { throw "Version '$version' is not x.y.z or x.y.z-pre" }
          if ($m.Groups[1].Value -ne $base) {
            throw "Version $version does not match Cargo.toml's $base (the exe embeds Cargo.toml's version); bump it first."
          }
          $pre = $m.Groups[2].Success
          if ($env:INPUT_CHANNEL -eq "win" -and $pre) { throw "The win channel takes a plain x.y.z; use beta for $version." }
          if ($env:INPUT_CHANNEL -eq "beta" -and -not $pre) { throw "The beta channel takes a pre-release version (x.y.z-beta.N)." }
          if ($env:DRY_RUN -ne "true" -and "${{ github.ref }}" -ne "refs/heads/main") {
            throw "A signed release must run from main (the Artifact Signing credential trusts main and v* tags only). Use dry_run elsewhere."
          }
          $tag = "$env:TAG_PREFIX$version"
          $existing = gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate --jq '.[].tag_name'
          # Drafts count: a dry run's draft must be deleted before the next run.
          if ($existing -contains $tag) { throw "A release (or draft) $tag already exists." }
          git ls-remote --exit-code --tags origin "refs/tags/$tag" | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Tag $tag already exists." }
          "version=$version", "tag=$tag", "prerelease=$($pre.ToString().ToLowerInvariant())",
            "channel=$env:INPUT_CHANNEL", "dry_run=$env:DRY_RUN" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "==> $tag (channel $env:INPUT_CHANNEL, dry run $env:DRY_RUN)"
          exit 0

  # Tests and builds Yap.exe. Read-only token, no OIDC: build scripts run here.
  build:
    needs: plan
    runs-on: windows-2025
    timeout-minutes: 150
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      YAP_NATIVE_BUILD_DIR: ${{ github.workspace }}\desktop-native\build\ci
      YAP_ORT_DIR: ${{ github.workspace }}\desktop-native\build\onnxruntime
      TOOLCHAIN_DIR: ${{ github.workspace }}\..\toolchain
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-10-16)

      # Registry and git deps, plus the dependency builds of both target
      # dirs (the release build's and the tests').
      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            desktop-native/rust -> ../build/ci/cargo/build
            desktop-native/rust -> ../build/test-target
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The archives (about 1.4 GB), keyed on the lock file; checksums are
      # checked again after a hit.
      - name: Toolchain cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.TOOLCHAIN_DIR }}-download
          key: native-toolchain-${{ hashFiles('desktop-native/tools/toolchain.lock.json') }}

      - name: Toolchain (static Qt, libwebrtc)
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./desktop-native/tools/fetch-toolchain.ps1 -Dest $env:TOOLCHAIN_DIR -DownloadDir "$env:TOOLCHAIN_DIR-download"

      # Qt's libraries are link-time code (-ltcg), which links only with the
      # MSVC that compiled them (toolchain.lock.json's msvc).
      - name: MSVC
        run: |
          $want = (Get-Content -Raw desktop-native/tools/toolchain.lock.json | ConvertFrom-Json).msvc
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -version "[17.0,18.0)" -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1
          if (-not $vs) { throw "No Visual Studio 2022 with the x64 C++ tools on this runner" }
          $have = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim()
          Write-Host "==> Visual Studio $vs, MSVC $have (Qt was built with $want)"
          if ($have -ne $want) {
            Write-Warning "MSVC $have differs from the toolchain's $want; the LTCG link may fail."
          }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja --no-progress -y }
          ninja --version

      # The dependency audit (desktop-native/rust/deny.toml; LIBRARIES.md
      # §18) before the long build. The [patch] path crates must exist for
      # cargo metadata (vendor.ps1; build.ps1 then finds them up to date).
      - name: Dependency audit (cargo deny)
        run: |
          cargo install cargo-deny --locked --version 0.20.2
          ./desktop-native/patches/vendor.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Push-Location desktop-native/rust
          cargo deny check
          $code = $LASTEXITCODE
          Pop-Location
          exit $code

      # The workspace tests that run headless (README, "Testing"): not the
      # app crate (Qt) or yap-audio (an audio device).
      - name: Cargo test
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -version "[17.0,18.0)" -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64" | Out-Null
          Push-Location desktop-native/rust
          cargo test --workspace --locked --exclude yap_native --exclude yap-audio --target-dir ../build/test-target
          $code = $LASTEXITCODE
          Pop-Location
          exit $code

      # ONNX Runtime 1.24.4, DirectML build (camera backgrounds;
      # docs/LIBRARIES.md §12.3), from nuget.org, checked by hash. Its DLL
      # keeps Microsoft's signature.
      - name: ONNX Runtime
        run: |
          $nupkg = "$env:RUNNER_TEMP\ort.nupkg"
          Invoke-WebRequest https://www.nuget.org/api/v2/package/Microsoft.ML.OnnxRuntime.DirectML/1.24.4 -OutFile $nupkg
          $sha = (Get-FileHash -Algorithm SHA256 $nupkg).Hash.ToLowerInvariant()
          if ($sha -ne "57e9f11b73437bef7a309496135d4c1f96b1a8e9ddba60013fa27bfc1d788681") { throw "ORT package hash $sha" }
          $tmp = "$env:RUNNER_TEMP\ort"
          7z x -y -bso0 "-o$tmp" $nupkg runtimes/win-x64/native/onnxruntime.dll LICENSE ThirdPartyNotices.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force $env:YAP_ORT_DIR | Out-Null
          Copy-Item "$tmp\runtimes\win-x64\native\onnxruntime.dll" $env:YAP_ORT_DIR
          Copy-Item "$tmp\LICENSE" "$env:YAP_ORT_DIR\LICENSE-onnxruntime.txt"
          Copy-Item "$tmp\ThirdPartyNotices.txt" "$env:YAP_ORT_DIR\ThirdPartyNotices-onnxruntime.txt"

      - name: Build Yap.exe
        run: |
          ./desktop-native/build.ps1 -QtDir $env:YAP_QT_DIR -BuildDir $env:YAP_NATIVE_BUILD_DIR
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = Get-Item "$env:YAP_NATIVE_BUILD_DIR\Yap.exe"
          Write-Host "==> Yap.exe $([math]::Round($exe.Length / 1MB, 1)) MB"

      - name: Upload the unsigned build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yap-native-build
          path: |
            desktop-native/build/ci/Yap.exe
            desktop-native/build/onnxruntime/
          if-no-files-found: error
          retention-days: 3

  # Signs, packs and publishes. The only job with OIDC and a write token.
  release:
    needs: [plan, build]
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: write
      # OIDC token for azure/login (Artifact Signing). No Azure secret is stored.
      id-token: write
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
      DRY_RUN: ${{ needs.plan.outputs.dry_run }}
      GH_TOKEN: ${{ github.token }}
      BUILD: ${{ github.workspace }}\_release\build
      OUT: ${{ github.workspace }}\_release\out
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download the build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: yap-native-build
          path: ${{ env.BUILD }}

      - name: Setup .NET (vpk only)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      # The splash Setup.exe shows (tools/build-splash.py).
      - name: Pillow
        run: python -m pip install --disable-pip-version-check pillow==12.1.1

      # The previous release of this channel, so vpk merges its feed and
      # builds a delta against its full package (the same files
      # `vpk download` fetches). Only desktop-native-v* releases count, and
      # stable never reads a pre-release.
      - name: Previous release
        run: |
          New-Item -ItemType Directory -Force $env:OUT | Out-Null
          $feed = "releases.$env:CHANNEL.json"
          $releases = gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate | ConvertFrom-Json
          $previous = $releases |
            Where-Object { -not $_.draft -and $_.tag_name.StartsWith($env:TAG_PREFIX) } |
            Where-Object { $env:CHANNEL -eq "beta" -or -not $_.prerelease } |
            Where-Object { $_.assets.name -contains $feed } |
            Sort-Object { [System.Management.Automation.SemanticVersion]$_.tag_name.Substring($env:TAG_PREFIX.Length) } -Descending |
            Select-Object -First 1
          if (-not $previous) { Write-Host "==> no earlier $feed: the first release of this channel, no delta"; exit 0 }
          gh release download $previous.tag_name --repo ${{ github.repository }} --pattern $feed --dir $env:OUT
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $assets = (Get-Content -Raw "$env:OUT\$feed" | ConvertFrom-Json).Assets
          $full = $assets | Where-Object Type -eq "Full" |
            Sort-Object { [System.Management.Automation.SemanticVersion]$_.Version } -Descending | Select-Object -First 1
          if ([System.Management.Automation.SemanticVersion]$full.Version -ge [System.Management.Automation.SemanticVersion]$env:VERSION) {
            throw "$env:VERSION is not newer than the published $($full.Version)."
          }
          $source = $releases | Where-Object { $_.assets.name -contains $full.FileName } | Select-Object -First 1
          gh release download $source.tag_name --repo ${{ github.repository }} --pattern $full.FileName --dir $env:OUT
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $sha = (Get-FileHash -Algorithm SHA256 "$env:OUT\$($full.FileName)").Hash
          if ($sha -ne $full.SHA256) { throw "$($full.FileName) does not match its feed entry" }
          Write-Host "==> delta base $($full.FileName) from $($source.tag_name)"

      - name: Release notes
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          $notes = if ($env:NOTES.Trim()) { $env:NOTES.Trim() } else { "Yap $env:VERSION." }
          Set-Content -Encoding utf8NoBOM "$env:RUNNER_TEMP\notes.md" $notes

      # OIDC federated credential on AZURE_CLIENT_ID: main and v* tags only.
      # The service principal holds only Artifact Signing Certificate Profile
      # Signer (docs/desktop/code-signing.md).
      - name: Azure login for Artifact Signing
        if: needs.plan.outputs.dry_run != 'true'
        uses: azure/login@053f7285eb20bf5469ef084617b0b24d3cec53fc # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Yap.exe is signed here, as desktop-release.yml signs its binaries;
      # vpk then signs what it adds (Update.exe, the root stub, Setup.exe)
      # through the same account. OBS's and Microsoft's files keep their
      # own signatures (package.ps1 --signExclude).
      - name: Sign Yap.exe
        if: needs.plan.outputs.dry_run != 'true'
        uses: azure/artifact-signing-action@208f8af4bf26cf2af8597424e3cb5582801523ba # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ env.BUILD }}\ci\Yap.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Yap
          description-url: https://yap.115jon.com

      - name: Pack with vpk
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          $pack = @{
            SkipBuild = $true
            BuildDir = "$env:BUILD\ci"
            OrtDir = "$env:BUILD\onnxruntime"
            OutDir = $env:OUT
            Version = $env:VERSION
            Channel = $env:CHANNEL
            ReleaseNotes = "$env:RUNNER_TEMP\notes.md"
            ObsCacheDir = "$env:RUNNER_TEMP\obs-signed-hook"
          }
          if ($env:DRY_RUN -ne "true") { $pack.Sign = $true }
          ./desktop-native/tools/package.ps1 @pack

      - name: Verify signatures
        if: needs.plan.outputs.dry_run != 'true'
        run: |
          $nupkg = "$env:OUT\$env:PACK_ID-$env:VERSION-full.nupkg"
          $x = "$env:RUNNER_TEMP\nupkg-check"
          # Ours only (the OBS hook and ONNX Runtime keep their vendors').
          7z x -y -bso0 "-o$x" $nupkg "lib/app/Yap.exe" "lib/app/Squirrel.exe" "lib/app/Yap_ExecutionStub.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $files = @("$env:OUT\$env:PACK_ID-$env:CHANNEL-Setup.exe") + (Get-ChildItem "$x\lib\app" -Filter *.exe).FullName
          if ($files.Count -ne 4) { throw "Expected Setup.exe and three exes in the package, found $($files.Count)" }
          ./desktop/scripts/verify-authenticode.ps1 -ExpectedSigner $env:ARTIFACT_SIGNING_SIGNER -Path $files

      # A draft first, so nothing is visible while files upload; packages
      # before the feed file, so a client never sees an entry whose package
      # is missing. Then publish with make_latest=false and check that the
      # Tauri app's "latest" release did not move.
      - name: Publish the GitHub release
        run: |
          $repo = "${{ github.repository }}"
          $files = @(
            Get-ChildItem $env:OUT -Filter "$env:PACK_ID-$env:VERSION-*.nupkg"
            Get-Item "$env:OUT\$env:PACK_ID-$env:CHANNEL-Setup.exe"
            Get-ChildItem $env:OUT -Filter "$env:PACK_ID-$env:CHANNEL-Portable.zip"
          ) | Where-Object { $_ }
          $feed = Get-Item "$env:OUT\releases.$env:CHANNEL.json"

          $sums = ($files + $feed | ForEach-Object { "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant())  $($_.Name)" }) -join "`n"
          $kind = if ($env:CHANNEL -eq "beta") { "beta" } else { "stable" }
          $body = @(
            (Get-Content -Raw "$env:RUNNER_TEMP\notes.md").Trim(), "",
            "---", "",
            "Native Windows app ($kind channel, ``$env:CHANNEL``), built from ${{ github.sha }} by [run ${{ github.run_id }}](${{ github.server_url }}/$repo/actions/runs/${{ github.run_id }}).",
            "Install with ``$env:PACK_ID-$env:CHANNEL-Setup.exe``; installed copies update from this release's ``releases.$env:CHANNEL.json``.",
            $(if ($env:DRY_RUN -eq "true") { "", "**Dry run: unsigned, never to be published.**" }),
            "", '```text', $sums, '```'
          ) -join "`n"
          Set-Content -Encoding utf8NoBOM "$env:RUNNER_TEMP\body.md" $body

          $latestBefore = gh api "repos/$repo/releases/latest" --jq .tag_name 2>$null
          $create = @("release", "create", $env:TAG, "--repo", $repo, "--draft", "--latest=false",
                      "--target", "${{ github.sha }}", "--title", "Yap native $env:VERSION",
                      "--notes-file", "$env:RUNNER_TEMP\body.md")
          if ($env:PRERELEASE -eq "true") { $create += "--prerelease" }
          gh @create
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release upload $env:TAG --repo $repo @($files.FullName)
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release upload $env:TAG --repo $repo $feed.FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          $id = gh api "repos/$repo/releases" --paginate --jq ".[] | select(.draft and .tag_name == `"$env:TAG`") | .id" | Select-Object -First 1
          if ($env:DRY_RUN -eq "true") {
            Write-Host "==> dry run: left as draft release $id ($env:TAG)"
            "Draft release ``$env:TAG`` (id $id), unsigned." | Out-File -Encoding utf8 -Append $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          gh api -X PATCH "repos/$repo/releases/$id" -F draft=false -f make_latest=false | Out-Null
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $latestAfter = gh api "repos/$repo/releases/latest" --jq .tag_name
          if ($latestBefore -and $latestAfter -ne $latestBefore) {
            Write-Warning "latest moved from $latestBefore to $latestAfter; restoring"
            $prev = gh api "repos/$repo/releases/tags/$latestBefore" --jq .id
            gh api -X PATCH "repos/$repo/releases/$prev" -f make_latest=true | Out-Null
            throw "The native release became latest; restored $latestBefore."
          }
          Write-Host "==> published $env:TAG; latest is still $latestAfter"
          "Published [$env:TAG](${{ github.server_url }}/$repo/releases/tag/$env:TAG) ($env:CHANNEL)." |
            Out-File -Encoding utf8 -Append $env:GITHUB_STEP_SUMMARY
