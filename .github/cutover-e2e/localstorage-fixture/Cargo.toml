# Writes a Chromium localStorage LevelDB (the Tauri app's CEF profile) for
# the cutover E2E (.github/workflows/desktop-cutover-e2e.yml), so the native
# app's import (native yap_core::tauri::import) has values to read.
# The same crate and version the import reads it with.
[package]
name = "localstorage-fixture"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rusty-leveldb = { version = "=4.0.2", default-features = false }
serde_json = "1"

# Its own workspace, apart from desktop/src-tauri.
[workspace]
