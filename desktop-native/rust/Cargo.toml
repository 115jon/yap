[workspace]
members = [
    "crates/yap-cache",
    "crates/yap-capture",
    "crates/yap-core",
    "crates/yap-protocol",
    "crates/yap-realtime",
    "crates/yap-voice",
    "crates/yap-audio",
    "crates/yap-anim",
    "crates/yap-webm",
    "crates/yap-segment",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
yap-cache = { path = "crates/yap-cache" }
yap-capture = { path = "crates/yap-capture" }
yap-core = { path = "crates/yap-core" }
yap-protocol = { path = "crates/yap-protocol" }
yap-realtime = { path = "crates/yap-realtime" }
yap-voice = { path = "crates/yap-voice" }
yap-audio = { path = "crates/yap-audio" }
yap-anim = { path = "crates/yap-anim" }
yap-webm = { path = "crates/yap-webm" }
yap-segment = { path = "crates/yap-segment" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[package]
name = "yap_native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib"]

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = "0.10"
futures-util = "0.3.34"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
yap-cache.workspace = true
yap-capture.workspace = true
yap-core.workspace = true
yap-protocol.workspace = true
yap-realtime.workspace = true
yap-voice.workspace = true
yap-audio = { workspace = true, features = ["libopus"] }
yap-anim.workspace = true
yap-webm = { workspace = true, features = ["libvpx"] }
yap-segment.workspace = true
# Camera background pictures (the formats the web uploads, less AVIF).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# The loopback relay's path tokens (already in the lock through yap-voice).
uuid = { version = "1.29.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Registry",
] }
# The installer's startup hooks (src/installer.rs, docs/INSTALLER.md). Pinned:
# tools/package.ps1 and the release workflow use the vpk of the same version.
velopack = "=1.3.39-g8d2844f"
# WebView2 for iframe embeds (YouTube, Spotify, TikTok's player). The
# version Tauri's desktop app uses (desktop/src-tauri/Cargo.lock); it links
# WebView2LoaderStatic.lib, so no loader DLL ships.
webview2-com = "=0.38.2"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61"
# Minidumps on a crash (src/crash.rs): Embark's in-process handler for
# exceptions, aborts and pure calls, and rust-minidump's writer.
crash-handler = "0.6"
minidump-writer = "0.10"

[build-dependencies]
cxx-qt-build = "0.10"

[lints]
workspace = true

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"

[features]
link_qt_object_files = ["cxx-qt-build/link_qt_object_files"]
