[package]
name = "yap_native"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
anyhow = "1.0.104"
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = "0.10"
futures-util = "0.3.34"
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }

[build-dependencies]
cxx-qt-build = "0.10"


[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"

[features]
link_qt_object_files = ["cxx-qt-build/link_qt_object_files"]
