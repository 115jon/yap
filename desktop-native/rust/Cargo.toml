[workspace]
members = [
    "crates/yap-cache",
    "crates/yap-core",
    "crates/yap-protocol",
    "crates/yap-realtime",
    "crates/yap-voice",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
yap-cache = { path = "crates/yap-cache" }
yap-core = { path = "crates/yap-core" }
yap-protocol = { path = "crates/yap-protocol" }
yap-realtime = { path = "crates/yap-realtime" }
yap-voice = { path = "crates/yap-voice" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[package]
name = "yap_native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib"]

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = "0.10"
futures-util = "0.3.34"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
yap-cache.workspace = true
yap-core.workspace = true
yap-protocol.workspace = true
yap-realtime.workspace = true
yap-voice.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Media_Audio"] }

[build-dependencies]
cxx-qt-build = "0.10"

[lints]
workspace = true

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"

[features]
link_qt_object_files = ["cxx-qt-build/link_qt_object_files"]
