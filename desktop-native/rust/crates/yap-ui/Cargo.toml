[package]
name = "yap-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The view layer the desktop and mobile apps share: the Yap.Ui QML module (theme, shared components and delegates), the list models, the domain QObjects and the GUI-thread registry behind them."
# cxx-qt-build exports this crate's interface (its QML module, initializers
# and headers) to the app crate that links it; that needs a links key.
links = "yap_ui"

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = "0.10"
# The extras' picture sizes (the formats the web uploads, less AVIF).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# No TLS backend here: the app picks one (native-tls on the desktop, rustls
# on mobile) for these and hands the core its HTTP client (Platform).
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid = { version = "1.29.0", features = ["v4"] }
yap-anim.workspace = true
yap-cache.workspace = true
# Path deps, not workspace ones: the workspace entries keep their default
# (desktop) features, and the mobile app builds this crate without them.
yap-core = { path = "../yap-core", default-features = false }
yap-protocol.workspace = true
yap-realtime = { path = "../yap-realtime", default-features = false }

[build-dependencies]
cxx-qt-build = "0.10"

[features]
# The desktop's patched qt-build-utils (desktop-native/patches/qt-build-utils):
# QML compiled to bytecode only, and the .qml sources left out of the
# resources. An unpatched qt-build-utils ignores it.
slim-qml = []

[lints]
workspace = true
