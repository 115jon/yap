[package]
name = "yap-games"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Yap game detection on Windows: the game catalog's index, arRPC's matching rules, and a detector thread over the process list, the foreground window and Steam. No Qt, no network."

[dependencies]
yap-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
# The bundled catalog snapshot is gzipped; flate2 is in the app already
# (png, velopack).
flate2 = "1.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
