[package]
name = "yap-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Yap client core: typed state store (pure reducer), effect runner, REST and auth. No Qt."

[dependencies]
futures-util = "0.3.34"
keyring.workspace = true
# Reads the Tauri app's localStorage (Chromium's LevelDB) once, to import
# its theme and sound settings (src/tauri.rs). In memory only: no "fs"
# feature, the files are read into its MemEnv.
rusty-leveldb = { version = "4.0.2", default-features = false, optional = true }
reqwest = { workspace = true, features = ["multipart", "stream"] }
# Release versions for the updater (src/update.rs), the same crate and
# order Velopack compares them with.
semver = { version = "1.0.28", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
yap-cache.workspace = true
yap-protocol.workspace = true

[features]
# The TLS backend: native-tls (SChannel on Windows) for desktop, rustls
# (no system OpenSSL) for Android and iOS. The caller of `runtime::spawn`
# brings a client built for rustls (desktop-native/mobile).
default = ["native-tls", "desktop"]
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls-no-provider"]
# The Windows app's own lifecycle: its install and registry entries
# (src/install.rs), the in-app updater (src/update.rs) and the Tauri app's
# replacement (src/tauri.rs). A phone app has none of these.
desktop = ["dep:rusty-leveldb", "dep:semver"]

[[test]]
name = "install"
required-features = ["desktop"]

[[test]]
name = "tauri_replace"
required-features = ["desktop"]

[[test]]
name = "update"
required-features = ["desktop"]

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
