# The mobile prototype's Rust side: yap-core behind a UniFFI boundary
# (desktop-native/mobile/README.md). Its own workspace, so the desktop
# workspace's vendored [patch] set (libwebrtc, webrtc-sys, qt-build-utils)
# is not needed to build it; the crates come in by path, unchanged.
[workspace]
members = ["."]
resolver = "2"

[package]
name = "yap-mobile"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "yap_mobile"

[[bin]]
# Generates the Kotlin and Swift bindings from the built library.
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.29", features = ["cli"] }
# The desktop crates, unchanged, on the rustls backend (Android has no
# system OpenSSL for native-tls).
yap-core = { path = "../../rust/crates/yap-core", default-features = false, features = ["rustls"] }
yap-protocol = { path = "../../rust/crates/yap-protocol" }
yap-realtime = { path = "../../rust/crates/yap-realtime", default-features = false, features = ["rustls"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[target.'cfg(target_os = "android")'.dependencies]
# stderr (the core's eprintln! log) into logcat.
libc = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = "symbols"
