[package]
name = "yap-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Yap gateway wire protocol: opcodes, close codes, frames and REST DTOs. No I/O."

[dependencies]
serde.workspace = true
serde_json.workspace = true
# Radio URLs are checked as the room parses them (already in the lock
# through reqwest).
url = "2.5.8"
# TypeScript declarations of these types for the web
# (packages/protocol/src/generated, written by packages/rust/protocol-ts).
# Off in every app build.
ts-rs = { version = "=12.0.1", optional = true, features = ["serde-json-impl", "no-serde-warnings"] }

[features]
ts = ["dep:ts-rs"]

[lints]
workspace = true
