[package]
name = "yap-hotkeys"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Yap's global keybinds: bindings and their text form, the saved settings, chord matching, push to talk's state machine and the recorder (pure), and on Windows the low-level keyboard and mouse hook thread. No Qt."

[dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
