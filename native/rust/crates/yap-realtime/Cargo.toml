[package]
name = "yap-realtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Yap realtime sockets: one reconnecting, resuming WebSocket connection with heartbeat liveness and the close-code policy. No Qt."

[dependencies]
futures-util = "0.3.34"
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite = "0.30.0"
yap-protocol.workspace = true

[features]
# The socket's TLS backend, as in yap-core: native-tls on desktop, rustls
# with the bundled web roots on mobile (the process's rustls crypto
# provider must be installed first).
default = ["native-tls"]
native-tls = ["tokio-tungstenite/native-tls"]
rustls = ["tokio-tungstenite/rustls-tls-webpki-roots"]

[dev-dependencies]
tokio = { workspace = true, features = ["net"] }

[lints]
workspace = true
