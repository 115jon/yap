[package]
name = "yap-speaker"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Yap's one speaker: every sound the app plays (the call's mix, the soundboard, Listen Together, UI sounds) is an input of one render stream (shared-mode WASAPI on Windows, AAudio on Android), with a tap after the final mix for the echo canceller. Follows the Windows default device. No Qt."

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = "0.62"

# The Android output (src/aaudio.rs): AAudio through rust-mobile's `ndk`
# bindings. API 28 for the stream's usage (call audio or UI sound), the
# app's minSdk.
[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", default-features = false, features = ["audio", "api-level-28"] }

[lints]
workspace = true
