[package]
name = "protocol-ts"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Writes yap-protocol's wire types as TypeScript (packages/protocol/src/generated)."

[dependencies]
ts-rs = { version = "=12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
yap-protocol = { path = "../../../native/rust/crates/yap-protocol", features = ["ts"] }
