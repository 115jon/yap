# Rust built for the web app, apart from the native workspace
# (native/rust), whose patched crates (native/rust/vendor) exist only
# after its toolchain step. These crates reach the native crates by path, so
# a plain checkout with stable Rust builds them (CI's `rust-shared` job).
#
# Cargo.lock is committed and every build passes --locked: the wasm the web
# ships comes from these exact crates. release-please bumps the native
# crates' versions, so native/tools/sync-cargo-lock-version.mjs syncs this
# lock too (`--also`, in ci.yml and release-please.yml). rust-toolchain.toml
# pins the compiler; run cargo from this directory.
[workspace]
resolver = "2"
members = ["protocol-ts", "yap-core-wasm"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"
publish = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
